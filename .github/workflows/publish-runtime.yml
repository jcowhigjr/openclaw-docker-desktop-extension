name: Publish runtime image

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - '.github/workflows/publish-runtime.yml'
  schedule:
    # Rebuild the wrapper against ghcr.io/openclaw/openclaw:latest even when this repo is unchanged.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  RUNTIME_IMAGE: ghcr.io/${{ github.repository_owner }}/openclaw-docker-desktop-extension-runtime
  LEGACY_RUNTIME_IMAGE: ghcr.io/${{ github.repository_owner }}/openclaw-docker-extension-runtime

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: |
            ${{ env.RUNTIME_IMAGE }}
            ${{ env.LEGACY_RUNTIME_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: runtime
          file: runtime/Dockerfile
          pull: true
          build-args: |
            OPENCLAW_VERSION=latest
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify published runtime image
        run: |
          docker buildx imagetools inspect "${RUNTIME_IMAGE}:latest"
          docker buildx imagetools inspect "${LEGACY_RUNTIME_IMAGE}:latest"
