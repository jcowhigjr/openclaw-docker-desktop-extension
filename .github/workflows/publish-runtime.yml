name: Publish runtime image

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - '.github/workflows/publish-runtime.yml'
  schedule:
    # Rebuild the wrapper against ghcr.io/openclaw/openclaw:latest even when this repo is unchanged.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  RUNTIME_IMAGE: ghcr.io/${{ github.repository_owner }}/openclaw-docker-desktop-extension-runtime
  LEGACY_RUNTIME_IMAGE: ghcr.io/${{ github.repository_owner }}/openclaw-docker-extension-runtime

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ${{ env.RUNTIME_IMAGE }}
            ${{ env.LEGACY_RUNTIME_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v7
        with:
          context: runtime
          file: runtime/Dockerfile
          pull: true
          build-args: |
            OPENCLAW_VERSION=latest
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify published runtime image
        run: |
          docker buildx imagetools inspect "${RUNTIME_IMAGE}:latest"
          docker buildx imagetools inspect "${LEGACY_RUNTIME_IMAGE}:latest"
