name: Publish runtime image

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - '.github/workflows/publish-runtime.yml'
  schedule:
    # Rebuild the wrapper against ghcr.io/openclaw/openclaw:latest even when this repo is unchanged.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  RUNTIME_IMAGE: ghcr.io/${{ github.repository_owner }}/openclaw-docker-desktop-extension-runtime
  LEGACY_RUNTIME_IMAGE: ghcr.io/${{ github.repository_owner }}/openclaw-docker-extension-runtime

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        id: meta
        with:
          images: |
            ${{ env.RUNTIME_IMAGE }}
            ${{ env.LEGACY_RUNTIME_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: runtime
          file: runtime/Dockerfile
          pull: true
          build-args: |
            OPENCLAW_VERSION=latest
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify published runtime image
        run: |
          docker buildx imagetools inspect "${RUNTIME_IMAGE}:latest"
          docker buildx imagetools inspect "${LEGACY_RUNTIME_IMAGE}:latest"
