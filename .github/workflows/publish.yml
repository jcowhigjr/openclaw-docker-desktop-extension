name: Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish or repair
        required: true
        type: string
      promote_channel:
        description: Also move the floating stable/beta channel tag during manual repair
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  EXTENSION_IMAGE_NAME: jcowhigjr/openclaw-docker-desktop-extension
  RUNTIME_IMAGE_NAME: jcowhigjr/openclaw-docker-desktop-extension-runtime
  DOCKERHUB_EXTENSION_IMAGE_NAME: jcowhigjr/openclaw-docker-desktop-extension

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Resolve release metadata
        id: release-context
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PROMOTE_CHANNEL: ${{ inputs.promote_channel }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="${INPUT_RELEASE_TAG}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          case "${release_tag}" in
            v*)
              ;;
            *)
              echo "release_tag must start with v, got: ${release_tag}" >&2
              exit 1
              ;;
          esac

          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION=${release_tag#v}" >> "${GITHUB_ENV}"
          ./scripts/release-channel.sh "${release_tag}" "${{ github.event_name }}" "${INPUT_PROMOTE_CHANNEL}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata for runtime
        id: runtime-meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.RUNTIME_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ env.RELEASE_VERSION }}
            type=raw,value=${{ steps.release-context.outputs.channel_tag }},enable=${{ steps.release-context.outputs.has_channel_tag }}
            type=sha,prefix=sha-

      - name: Build and push runtime image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: runtime
          file: runtime/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.runtime-meta.outputs.tags }}
          labels: ${{ steps.runtime-meta.outputs.labels }}

      - name: Run Trivy vulnerability scanner (runtime)
        uses: aquasecurity/trivy-action@df678dbccf677bc6937338d569ba0da18964a8cc # master
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.RUNTIME_IMAGE_NAME }}:${{ steps.runtime-meta.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Docker metadata for extension
        id: extension-meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.EXTENSION_IMAGE_NAME }}
            ${{ env.DOCKERHUB_EXTENSION_IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=OpenClaw
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ env.RELEASE_VERSION }}
            type=raw,value=${{ steps.release-context.outputs.channel_tag }},enable=${{ steps.release-context.outputs.has_channel_tag }}
            type=sha,prefix=sha-

      - name: Build and push extension image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.extension-meta.outputs.tags }}
          labels: ${{ steps.extension-meta.outputs.labels }}
          build-args: |
            VITE_DEFAULT_RUNTIME_IMAGE=${{ env.REGISTRY }}/${{ env.RUNTIME_IMAGE_NAME }}:${{ env.RELEASE_VERSION }}

      - name: Run Trivy vulnerability scanner (extension)
        uses: aquasecurity/trivy-action@df678dbccf677bc6937338d569ba0da18964a8cc # master
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.EXTENSION_IMAGE_NAME }}:${{ steps.extension-meta.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Create or update GitHub release for tag
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
