name: Publish

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing v* tag created by the release workflow
        required: true
        type: string
      promote_channel:
        description: Move the matching stable/beta channel after validation
        required: false
        default: true
        type: boolean
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish or repair
        required: true
        type: string
      promote_channel:
        description: Also move the floating stable/beta channel tag during manual repair
        required: false
        default: false
        type: boolean
concurrency:
  group: openclaw-published-channels
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  EXTENSION_IMAGE_NAME: jcowhigjr/openclaw-docker-desktop-extension
  RUNTIME_IMAGE_NAME: jcowhigjr/openclaw-docker-desktop-extension-runtime
  DOCKERHUB_EXTENSION_IMAGE_NAME: jcowhigjr/openclaw-docker-desktop-extension

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve release metadata
        id: release-context
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PROMOTE_CHANNEL: ${{ inputs.promote_channel }}
        run: |
          if [ -n "${INPUT_RELEASE_TAG}" ]; then
            release_tag="${INPUT_RELEASE_TAG}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          case "${release_tag}" in
            v*)
              ;;
            *)
              echo "release_tag must start with v, got: ${release_tag}" >&2
              exit 1
              ;;
          esac

          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION=${release_tag#v}" >> "${GITHUB_ENV}"
          ./scripts/release-channel.sh "${release_tag}" "${{ github.event_name }}" "${INPUT_PROMOTE_CHANNEL}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata for runtime
        id: runtime-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.RUNTIME_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ env.RELEASE_VERSION }}
            type=sha,prefix=sha-

      - name: Build and push runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: runtime
          file: runtime/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.runtime-meta.outputs.tags }}
          labels: ${{ steps.runtime-meta.outputs.labels }}

      - name: Run Trivy vulnerability scanner (runtime)
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.RUNTIME_IMAGE_NAME }}:${{ steps.runtime-meta.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Docker metadata for extension
        id: extension-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.EXTENSION_IMAGE_NAME }}
            ${{ env.DOCKERHUB_EXTENSION_IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=OpenClaw
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ env.RELEASE_VERSION }}
            type=sha,prefix=sha-

      - name: Build and push extension image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.extension-meta.outputs.tags }}
          labels: ${{ steps.extension-meta.outputs.labels }}
          build-args: |
            VITE_DEFAULT_RUNTIME_IMAGE=${{ env.REGISTRY }}/${{ env.RUNTIME_IMAGE_NAME }}:${{ steps.release-context.outputs.runtime_channel_tag }}

      - name: Run Trivy vulnerability scanner (extension)
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.EXTENSION_IMAGE_NAME }}:${{ steps.extension-meta.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Promote validated release channels
        if: ${{ steps.release-context.outputs.has_channel_tag == 'true' }}
        env:
          CHANNEL_TAG: ${{ steps.release-context.outputs.channel_tag }}
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${RUNTIME_IMAGE_NAME}:${CHANNEL_TAG}" \
            "${REGISTRY}/${RUNTIME_IMAGE_NAME}:${RELEASE_VERSION}"
          docker buildx imagetools create \
            --tag "${REGISTRY}/${EXTENSION_IMAGE_NAME}:${CHANNEL_TAG}" \
            "${REGISTRY}/${EXTENSION_IMAGE_NAME}:${RELEASE_VERSION}"
          docker buildx imagetools create \
            --tag "${DOCKERHUB_EXTENSION_IMAGE_NAME}:${CHANNEL_TAG}" \
            "${DOCKERHUB_EXTENSION_IMAGE_NAME}:${RELEASE_VERSION}"

      - name: Verify promoted release channels
        if: ${{ steps.release-context.outputs.has_channel_tag == 'true' }}
        env:
          CHANNEL_TAG: ${{ steps.release-context.outputs.channel_tag }}
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${RUNTIME_IMAGE_NAME}:${CHANNEL_TAG}"
          docker buildx imagetools inspect "${REGISTRY}/${EXTENSION_IMAGE_NAME}:${CHANNEL_TAG}"
          docker buildx imagetools inspect "${DOCKERHUB_EXTENSION_IMAGE_NAME}:${CHANNEL_TAG}"

      - name: Create or update GitHub release for tag
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
