name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui

      - name: Verify docs landing page
        run: make test-docs-landing-page

      - name: Build runtime image
        run: docker build -t openclaw-docker-extension-runtime:test -f runtime/Dockerfile runtime

      - name: Build extension image
        run: docker build -t openclaw-docker-extension:test .

      - name: Verify runtime bridge wiring
        run: make test-runtime-bridge

      - name: Verify extension marketplace metadata
        run: make test-extension-metadata

      - name: Verify release channel mapping
        run: make test-release-channel

      - name: Verify release tag dry-run
        run: make test-release-tag-dry-run

      - name: Verify release title dry-run
        run: make test-verify-release-tag-title

      - name: Verify release install dry-run wrappers
        run: make test-release-install-dry-run

      - name: Verify release channel dry-run helpers
        run: make test-release-channel-dry-run

      - name: Verify release bundle wiring
        run: make verify-release-bundle RELEASE_TAG=v0.0.0-ci

      - name: Verify UI screenshot-sync guard logic
        run: make test-ui-screenshot-sync

      - name: Check UI screenshot sync (pull requests)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
          BASE_REF="$BASE_REF" bash ./scripts/test-ui-screenshot-sync.sh
