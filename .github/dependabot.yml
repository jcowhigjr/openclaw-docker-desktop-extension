version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    # Conservative: only one Dependabot PR at a time
    open-pull-requests-limit: 1
    # Only open PRs for direct (top-level) dependencies by default
    allow:
      - dependency-type: "direct"
    ignore:
      # Docker's current extension theme package peers with MUI 5-6.
      # Keep this lane on compatible UI majors until that package supports newer MUI.
      - dependency-name: "@mui/material"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@mui/icons-material"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react-dom"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
    groups:
      ui-dependencies:
        patterns:
          - "*"
        # Keep grouped UI update PRs compatible with Docker's extension theme peer range.
        update-types:
          - "minor"
          - "patch"

  # Ensure security updates for UI npm packages appear immediately
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    security-updates-only: true

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
